services:
  postgres:
    image: postgres:16-alpine
    container_name: kubolesie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kubolesie
      POSTGRES_PASSWORD: kubolesie
      POSTGRES_DB: kubolesie
    ports:
      - "5432:5432"
    volumes:
      - kubolesie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubolesie -d kubolesie"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kubolesie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kubolesie_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  kubolesie_pgdata:
  kubolesie_redis:
